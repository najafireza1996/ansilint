name: Feature request
description: Propose a feature that is not a lint rule
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to do today? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that solves the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not require running Ansible or Python.
        - label: This does not require network access at lint time.
        - label: This is not a speculative config option (YAGNI, ENG-20).
