name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (yaml_parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-fuzz
      - name: Fuzz the YAML parser for five minutes
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu yaml_parse -- -max_total_time=300
      - name: Fuzz the model builder for five minutes
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu model -- -max_total_time=300
