name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (yaml_parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-fuzz
      - name: Fuzz the YAML parser for five minutes
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu yaml_parse -- -max_total_time=300
      - name: Fuzz the model builder for five minutes
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu model -- -max_total_time=300
