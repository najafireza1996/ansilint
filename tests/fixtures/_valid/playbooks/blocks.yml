---
- name: Blocks
  hosts: all
  tasks:
    - name: Outer
      block:
        - name: Inner block
          block:
            - name: Deep
              ansible.builtin.command: /bin/true
              changed_when: false
          rescue:
            - name: Recover
              ansible.builtin.debug:
                msg: rescued
          always:
            - name: Always
              ansible.builtin.debug:
                msg: always
      when: true
